name: Release Kernel

on:
  workflow_dispatch:

jobs:
  download-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download release info
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/$GH_REPO/releases/latest"
          echo "Lade Release-Metadaten von $API_URL"
          STATUS=$(curl -sS -w "%{http_code}" -H "Authorization: Bearer $GH_TOKEN" \
                   "$API_URL" -o release_info.json)

          if [ "$STATUS" -ne 200 ]; then
            echo "::error::Kein Release gefunden (HTTP $STATUS). Erstelle zuerst ein Release im Repository $GH_REPO."
            cat release_info.json
            exit 1
          fi

          mkdir -p assets

      - name: Download all assets
        run: |
          set -euo pipefail

          ASSET_INFO=$(jq -r '.assets[]? | @base64' release_info.json)

          if [ -z "$ASSET_INFO" ]; then
            echo "::error::Das aktuelle Release enthält keine Assets. Lade zuerst Builds hoch."
            exit 1
          fi

          while IFS= read -r line; do
            [ -z "$line" ] && continue

            asset_json=$(echo "$line" | base64 --decode)
            ASSET_ID=$(echo "$asset_json" | jq -r '.id')
            ASSET_NAME=$(echo "$asset_json" | jq -r '.name')

            echo "Lade Asset $ASSET_NAME (ID $ASSET_ID)"

            curl -L -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$GH_REPO/releases/assets/$ASSET_ID" \
              -o "$ASSET_NAME"
          done <<<"$ASSET_INFO"

          shopt -s nullglob
          mv *.zip assets/
          shopt -u nullglob

      - name: Upload assets
        uses: actions/upload-artifact@v4.3.5
        with:
          name: kernel_samsung_dm3q
          path: assets

      - name: Generate TAG
        run: |
          DATE=$(date +'%y.%m.%d')
          echo "TAG=$DATE" >> $GITHUB_ENV

      - name: Upload release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "assets/*.zip"
          allowUpdates: true
          name: "kernel_samsung_dm3q"
          tag: "CI_${{ env.TAG }}"
          body: |
            Commit: ${{ github.sha }}
            ### Note: 
            Flash the kernel zip with [kernel flasher](https://github.com/qlenlen/KernelFlasher/releases) or TWRP
            Both KSU and KSU-NEXT are provided, and each has a susfs edition available.

            If you prefer LKM mode, do not forget to patch your init_boot.
            ### CHANGELOG

            ### 更新日志
